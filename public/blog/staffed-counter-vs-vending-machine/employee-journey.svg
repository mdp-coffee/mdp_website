<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Montserrat', sans-serif">
  <rect x="0" y="0" width="1600" height="1000" fill="#F9F0E1"/>

  <!-- header -->
  <rect x="660" y="40" width="280" height="26" rx="13" fill="none" stroke="#41191533" stroke-width="1"/>
  <text x="800" y="57" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08" fill="#411915">THE EMPLOYEE JOURNEY</text>
  <text x="800" y="108" text-anchor="middle" font-size="38" font-weight="700" fill="#411915">Same 8:55, Two Different Mornings</text>
  <text x="800" y="136" text-anchor="middle" font-size="16" fill="#411915" opacity="0.68">One employee gets to the meeting on time. The other doesn&#8217;t.</text>

  <!-- meeting marker (shared reference, neutral) -->
  <line x1="800" y1="195" x2="800" y2="655" stroke="#2E2620" stroke-width="2" stroke-dasharray="2 6" opacity="0.55"/>
  <text x="800" y="164" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="0.06" fill="#2E2620">9:00 &#183; MEETING STARTS</text>

  <!-- Track 1: Staffed (gold) -->
  <text x="150" y="226" font-size="19" font-weight="700" fill="#8A5416">With a Staffed Counter</text>

  <rect x="95" y="262" width="110" height="52" rx="12" fill="#FFF3DC"/>
  <text x="150" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#8A5416">8:55</text>
  <text x="150" y="300" text-anchor="middle" font-size="12" fill="#411915" opacity="0.85">
    <tspan x="150">Grab coffee</tspan><tspan x="150" dy="13">(30 sec)</tspan>
  </text>

  <rect x="225" y="262" width="110" height="52" rx="12" fill="#FFF3DC"/>
  <text x="280" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#8A5416">8:56</text>
  <text x="280" y="300" text-anchor="middle" font-size="12" fill="#411915" opacity="0.85">Back at desk</text>

  <line x1="149" y1="322" x2="149" y2="350" stroke="#F0AD52" stroke-width="2"/>
  <line x1="279" y1="322" x2="279" y2="350" stroke="#F0AD52" stroke-width="2"/>
  <rect x="150" y="348" width="1300" height="4" rx="2" fill="#FDD489"/>
  <circle cx="150" cy="350" r="8" fill="#D98E2E"/>
  <circle cx="280" cy="350" r="8" fill="#D98E2E"/>
  <circle cx="800" cy="350" r="8" fill="#8A5416"/>

  <rect x="710" y="372" width="150" height="34" rx="17" fill="#D98E2E"/>
  <path d="M732 389 l6 6 l12 -13" stroke="#F9F0E1" stroke-width="2.75" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="796" y="394" text-anchor="middle" font-size="15" font-weight="700" fill="#F9F0E1">9:00 &#183; On time</text>

  <!-- Track 2: Vending (neutral) -->
  <text x="150" y="466" font-size="19" font-weight="700" fill="#5E4F3F">With a Vending Machine</text>

  <rect x="75" y="502" width="150" height="52" rx="12" fill="#F3EFEA"/>
  <text x="150" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#5E4F3F">8:55</text>
  <text x="150" y="542" text-anchor="middle" font-size="12" fill="#411915" opacity="0.85">Joins the queue</text>

  <rect x="335" y="502" width="150" height="52" rx="12" fill="#F3EFEA"/>
  <text x="410" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#5E4F3F">8:57</text>
  <text x="410" y="542" text-anchor="middle" font-size="12" fill="#411915" opacity="0.85">Machine jams</text>

  <rect x="595" y="502" width="150" height="52" rx="12" fill="#F3EFEA"/>
  <text x="670" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#5E4F3F">8:59</text>
  <text x="670" y="542" text-anchor="middle" font-size="12" fill="#411915" opacity="0.85">Still waiting</text>

  <rect x="1115" y="502" width="150" height="52" rx="12" fill="#F3EFEA"/>
  <text x="1190" y="524" text-anchor="middle" font-size="14" font-weight="700" fill="#5E4F3F">9:03</text>
  <text x="1190" y="542" text-anchor="middle" font-size="12" fill="#411915" opacity="0.85">Finally gets coffee</text>

  <line x1="149" y1="562" x2="149" y2="590" stroke="#9C8873" stroke-width="2"/>
  <line x1="409" y1="562" x2="409" y2="590" stroke="#9C8873" stroke-width="2"/>
  <line x1="669" y1="562" x2="669" y2="590" stroke="#9C8873" stroke-width="2"/>
  <line x1="1189" y1="562" x2="1189" y2="590" stroke="#9C8873" stroke-width="2"/>
  <rect x="150" y="588" width="1300" height="4" rx="2" fill="#D6C9BA"/>
  <circle cx="150" cy="590" r="8" fill="#7C6A56"/>
  <circle cx="410" cy="590" r="8" fill="#7C6A56"/>
  <circle cx="670" cy="590" r="8" fill="#7C6A56"/>
  <circle cx="1190" cy="590" r="8" fill="#7C6A56"/>
  <circle cx="1320" cy="590" r="8" fill="#453A2E"/>

  <rect x="1210" y="612" width="170" height="34" rx="17" fill="#5E4F3F"/>
  <path d="M1234 621 L1246 633 M1246 621 L1234 633" stroke="#F9F0E1" stroke-width="2.75" stroke-linecap="round"/>
  <text x="1305" y="634" text-anchor="middle" font-size="15" font-weight="700" fill="#F9F0E1">9:04 &#183; 4 min late</text>

  <text x="800" y="930" text-anchor="middle" font-size="18" fill="#411915" opacity="0.7">The gap isn&#8217;t the coffee. It&#8217;s the nine minutes around it.</text>
</svg>
