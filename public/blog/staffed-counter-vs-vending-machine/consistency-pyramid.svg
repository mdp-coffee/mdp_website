<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Montserrat', sans-serif">
  <rect x="0" y="0" width="1600" height="1000" fill="#F9F0E1"/>

  <!-- header -->
  <rect x="670" y="60" width="260" height="26" rx="13" fill="none" stroke="#41191533" stroke-width="1"/>
  <text x="800" y="77" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08" fill="#411915">THE CONSISTENCY PYRAMID</text>
  <text x="800" y="130" text-anchor="middle" font-size="40" font-weight="700" fill="#411915">Consistency Starts Long Before Brewing</text>
  <text x="800" y="158" text-anchor="middle" font-size="17" fill="#411915" opacity="0.68">What the customer tastes is the smallest layer of the work.</text>

  <!-- tiers -->
  <rect x="350" y="280" width="900" height="96" rx="16" fill="#8A5416"/>
  <text x="800" y="332" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#F9F0E1">Daily Human Ownership</text>

  <rect x="430" y="390" width="740" height="96" rx="16" fill="#B06F1E"/>
  <text x="800" y="442" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#F9F0E1">Restocking &amp; Preparation</text>

  <rect x="510" y="500" width="580" height="96" rx="16" fill="#D98E2E"/>
  <text x="800" y="552" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#F9F0E1">Cleaning Standards</text>

  <rect x="590" y="610" width="420" height="96" rx="16" fill="#FEC87F"/>
  <text x="800" y="662" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#5C380E">Machine Health</text>

  <rect x="670" y="720" width="260" height="96" rx="16" fill="#FEE3B0"/>
  <text x="800" y="772" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#5C380E">Coffee Taste</text>

  <text x="800" y="880" text-anchor="middle" font-size="22" font-weight="400" fill="#411915">Consistent coffee starts long before brewing begins.</text>
</svg>
