<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1300" font-family="'Montserrat', sans-serif">
  <rect x="0" y="0" width="1600" height="1300" fill="#F9F0E1"/>

  <!-- header -->
  <rect x="700" y="70" width="200" height="26" rx="13" fill="none" stroke="#41191533" stroke-width="1"/>
  <text x="800" y="87" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08" fill="#411915">THE HIDDEN WORKFLOW</text>
  <text x="800" y="140" text-anchor="middle" font-size="40" font-weight="700" fill="#411915">What Happens After Someone Wants Coffee</text>
  <text x="800" y="168" text-anchor="middle" font-size="17" fill="#411915" opacity="0.68">Same request. Very different distance to a cup of coffee.</text>

  <!-- column headers -->
  <rect x="270" y="196" width="200" height="28" rx="14" fill="#D6C9BA"/>
  <text x="370" y="215" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.04" fill="#453A2E">VENDING MACHINE</text>
  <rect x="1170" y="196" width="200" height="28" rx="14" fill="#FDD489"/>
  <text x="1270" y="215" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.04" fill="#8A5416">STAFFED COUNTER</text>

  <!-- LEFT: 7-step broken flow -->
  <g>
    <rect x="120" y="260" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="155" cy="292" r="15" fill="#D6C9BA"/>
    <text x="155" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#453A2E">1</text>
    <text x="184" y="292" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Employee wants coffee</text>
  </g>
  <line x1="349" y1="324" x2="349" y2="360" stroke="#B8A794" stroke-width="2"/>
  <polygon points="343,360 355,360 349,368" fill="#B8A794"/>

  <g>
    <rect x="120" y="360" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="155" cy="392" r="15" fill="#D6C9BA"/>
    <text x="155" y="392" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#453A2E">2</text>
    <text x="184" y="392" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Machine is empty</text>
  </g>
  <line x1="349" y1="424" x2="349" y2="460" stroke="#B8A794" stroke-width="2"/>
  <polygon points="343,460 355,460 349,468" fill="#B8A794"/>

  <g>
    <rect x="120" y="460" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="155" cy="492" r="15" fill="#D6C9BA"/>
    <text x="155" y="492" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#453A2E">3</text>
    <text x="184" y="492" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Facilities informed</text>
  </g>
  <line x1="349" y1="524" x2="349" y2="560" stroke="#B8A794" stroke-width="2"/>
  <polygon points="343,560 355,560 349,568" fill="#B8A794"/>

  <g>
    <rect x="120" y="560" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="155" cy="592" r="15" fill="#D6C9BA"/>
    <text x="155" y="592" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#453A2E">4</text>
    <text x="184" y="592" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Vendor contacted</text>
  </g>
  <line x1="349" y1="624" x2="349" y2="660" stroke="#B8A794" stroke-width="2"/>
  <polygon points="343,660 355,660 349,668" fill="#B8A794"/>

  <g>
    <rect x="120" y="660" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="155" cy="692" r="15" fill="#D6C9BA"/>
    <text x="155" y="692" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#453A2E">5</text>
    <text x="184" y="692" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Technician scheduled</text>
  </g>
  <line x1="349" y1="724" x2="349" y2="760" stroke="#B8A794" stroke-width="2"/>
  <polygon points="343,760 355,760 349,768" fill="#B8A794"/>

  <g>
    <rect x="120" y="760" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="155" cy="792" r="15" fill="#D6C9BA"/>
    <text x="155" y="792" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#453A2E">6</text>
    <text x="184" y="792" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Machine repaired</text>
  </g>
  <line x1="349" y1="824" x2="349" y2="860" stroke="#B8A794" stroke-width="2"/>
  <polygon points="343,860 355,860 349,868" fill="#B8A794"/>

  <g>
    <rect x="120" y="860" width="460" height="64" rx="12" fill="#453A2E"/>
    <circle cx="155" cy="892" r="15" fill="#F3EFEA"/>
    <text x="155" y="892" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#2E2620">7</text>
    <text x="184" y="892" dominant-baseline="central" font-size="16" font-weight="700" fill="#F3EFEA">Coffee finally available</text>
  </g>

  <!-- RIGHT: 4-step flow, same start/end range, far more air -->
  <g>
    <rect x="1020" y="260" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="1055" cy="292" r="15" fill="#FEE3B0"/>
    <text x="1055" y="292" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#8A5416">1</text>
    <text x="1084" y="292" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Employee wants coffee</text>
  </g>
  <line x1="1249" y1="324" x2="1249" y2="436" stroke="#FEC87F" stroke-width="2"/>
  <polygon points="1243,436 1255,436 1249,444" fill="#FEC87F"/>

  <g>
    <rect x="1020" y="436" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="1055" cy="468" r="15" fill="#FEE3B0"/>
    <text x="1055" y="468" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#8A5416">2</text>
    <text x="1084" y="468" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Staff notices the issue</text>
  </g>
  <line x1="1249" y1="500" x2="1249" y2="612" stroke="#FEC87F" stroke-width="2"/>
  <polygon points="1243,612 1255,612 1249,620" fill="#FEC87F"/>

  <g>
    <rect x="1020" y="612" width="460" height="64" rx="12" fill="#FFFDF8"/>
    <circle cx="1055" cy="644" r="15" fill="#FEE3B0"/>
    <text x="1055" y="644" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#8A5416">3</text>
    <text x="1084" y="644" dominant-baseline="central" font-size="16" font-weight="600" fill="#411915">Fixes it immediately</text>
  </g>
  <line x1="1249" y1="676" x2="1249" y2="788" stroke="#FEC87F" stroke-width="2"/>
  <polygon points="1243,788 1255,788 1249,796" fill="#FEC87F"/>

  <g>
    <rect x="1020" y="788" width="460" height="64" rx="12" fill="#B06F1E"/>
    <circle cx="1055" cy="820" r="15" fill="#FFF3DC"/>
    <text x="1055" y="820" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="700" fill="#5C380E">4</text>
    <text x="1084" y="820" dominant-baseline="central" font-size="16" font-weight="700" fill="#FFF3DC">Coffee served</text>
  </g>

  <!-- closing line -->
  <text x="800" y="1150" text-anchor="middle" font-size="20" font-weight="400" fill="#411915">Downtime doesn't only interrupt coffee service. It interrupts work.</text>
</svg>
