<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'Montserrat', sans-serif">
  <rect x="0" y="0" width="1600" height="1000" fill="#F9F0E1"/>

  <!-- header -->
  <rect x="660" y="40" width="280" height="26" rx="13" fill="none" stroke="#41191533" stroke-width="1"/>
  <text x="800" y="57" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.08" fill="#411915">THE OFFICE FLOOR PLAN</text>
  <text x="800" y="108" text-anchor="middle" font-size="38" font-weight="700" fill="#411915">Same Office, Two Experiences</text>
  <text x="800" y="136" text-anchor="middle" font-size="16" fill="#411915" opacity="0.68">The floor plan doesn&#8217;t change. Which side of the room would you rather stand on?</text>

  <!-- floor -->
  <polygon points="800,230 80,510 800,791" fill="#F3EFEA"/>
  <polygon points="800,230 1520,510 800,791" fill="#FFF3DC"/>
  <line x1="800" y1="230" x2="800" y2="791" stroke="#2E2620" stroke-width="2" opacity="0.18"/>

  <!-- warm glow behind counter -->
  <ellipse cx="950" cy="420" rx="170" ry="95" fill="#FEE3B0" opacity="0.45"/>

  <!-- vending machine cube -->
  <polygon points="595,287 650,315 650,505 595,477" fill="#5E4F3F"/>
  <polygon points="650,315 705,287 705,477 650,505" fill="#2E2620"/>
  <polygon points="650,259 705,287 650,315 595,287" fill="#D6C9BA"/>
  <line x1="665" y1="365" x2="690" y2="397" stroke="#F3EFEA" stroke-width="5" stroke-linecap="round"/>
  <line x1="690" y1="365" x2="665" y2="397" stroke="#F3EFEA" stroke-width="5" stroke-linecap="round"/>
  <polygon points="650,210 632,242 668,242" fill="#70120E"/>
  <text x="650" y="237" font-size="15" font-weight="700" fill="#F9F0E1" text-anchor="middle">!</text>

  <!-- vending queue (frustrated) -->
  <g>
    <ellipse cx="510" cy="489" rx="18" ry="6" fill="#411915" opacity="0.12"/>
    <rect x="497" y="443" width="26" height="42" rx="12" fill="#453A2E"/>
    <circle cx="510" cy="433" r="13" fill="#7C6A56"/>
    <line x1="501" y1="427" x2="508" y2="430" stroke="#2E2620" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="519" y1="427" x2="512" y2="430" stroke="#2E2620" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M494,408 q4,-8 8,0" stroke="#453A2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M508,404 q4,-8 8,0" stroke="#453A2E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M528,416 q7,-3 3,-10" stroke="#2E2620" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M478,460 q-10,4 -14,-2 M478,470 q-10,4 -14,-2" stroke="#453A2E" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  </g>
  <g>
    <ellipse cx="370" cy="502" rx="18" ry="6" fill="#411915" opacity="0.12"/>
    <rect x="357" y="456" width="26" height="42" rx="12" fill="#453A2E"/>
    <circle cx="370" cy="446" r="13" fill="#7C6A56"/>
    <line x1="361" y1="440" x2="368" y2="443" stroke="#2E2620" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="379" y1="440" x2="372" y2="443" stroke="#2E2620" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M389,432 q3,-6 -3,-8" stroke="#5E4F3F" stroke-width="2" fill="#5E4F3F" opacity="0.7"/>
    <circle cx="390" cy="423" r="2.5" fill="#5E4F3F" opacity="0.7"/>
  </g>
  <g>
    <ellipse cx="230" cy="515" rx="18" ry="6" fill="#411915" opacity="0.12"/>
    <rect x="217" y="469" width="26" height="42" rx="12" fill="#453A2E"/>
    <circle cx="230" cy="459" r="13" fill="#7C6A56"/>
    <line x1="221" y1="453" x2="228" y2="456" stroke="#2E2620" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="239" y1="453" x2="232" y2="456" stroke="#2E2620" stroke-width="2.5" stroke-linecap="round"/>
    <rect x="240" y="426" width="30" height="20" rx="8" fill="#70120E"/>
    <polygon points="248,446 253,446 246,454" fill="#70120E"/>
    <text x="255" y="440" font-size="12" font-weight="700" fill="#F9F0E1" text-anchor="middle">!!</text>
  </g>

  <rect x="550" y="555" width="200" height="34" rx="17" fill="#E5DDD3"/>
  <text x="650" y="577" font-size="14" font-weight="700" fill="#2E2620" text-anchor="middle" letter-spacing="0.04">VENDING MACHINE</text>

  <!-- staffed counter -->
  <polygon points="860,357 950,402 950,522 860,477" fill="#D98E2E"/>
  <polygon points="950,402 1040,357 1040,477 950,522" fill="#8A5416"/>
  <polygon points="950,312 1040,357 950,402 860,357" fill="#FEE3B0"/>
  <rect x="938" y="275" width="24" height="20" rx="4" fill="#8A5416"/>
  <circle cx="942" cy="260" r="4" fill="#FEC87F" opacity="0.75"/>
  <circle cx="958" cy="255" r="4" fill="#FEC87F" opacity="0.75"/>

  <!-- barista -->
  <g>
    <ellipse cx="950" cy="375" rx="18" ry="6" fill="#411915" opacity="0.12"/>
    <rect x="937" y="329" width="26" height="42" rx="12" fill="#B06F1E"/>
    <circle cx="950" cy="319" r="13" fill="#F0AD52"/>
  </g>

  <!-- staffed: moving crowd, getting coffee and heading out -->
  <g>
    <ellipse cx="1090" cy="489" rx="18" ry="6" fill="#411915" opacity="0.12"/>
    <rect x="1077" y="443" width="26" height="42" rx="12" fill="#8A5416"/>
    <circle cx="1090" cy="433" r="13" fill="#D98E2E"/>
    <rect x="1100" y="450" width="14" height="16" rx="3" fill="#5C380E"/>
  </g>
  <g>
    <ellipse cx="1250" cy="506" rx="18" ry="6" fill="#411915" opacity="0.1"/>
    <rect x="1237" y="460" width="26" height="42" rx="12" fill="#B06F1E"/>
    <circle cx="1250" cy="450" r="13" fill="#F0AD52"/>
    <rect x="1260" y="467" width="14" height="16" rx="3" fill="#5C380E"/>
    <line x1="1200" y1="470" x2="1222" y2="473" stroke="#F0AD52" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <line x1="1195" y1="483" x2="1219" y2="486" stroke="#F0AD52" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  </g>
  <g opacity="0.75">
    <ellipse cx="1420" cy="522" rx="17" ry="6" fill="#411915" opacity="0.08"/>
    <rect x="1408" y="478" width="24" height="40" rx="11" fill="#D98E2E"/>
    <circle cx="1420" cy="468" r="12" fill="#FEC87F"/>
    <rect x="1429" y="485" width="13" height="15" rx="3" fill="#8A5416"/>
    <line x1="1362" y1="488" x2="1390" y2="492" stroke="#F0AD52" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <line x1="1357" y1="502" x2="1387" y2="506" stroke="#F0AD52" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
    <line x1="1362" y1="516" x2="1384" y2="519" stroke="#F0AD52" stroke-width="3" stroke-linecap="round" opacity="0.25"/>
  </g>

  <rect x="850" y="555" width="200" height="34" rx="17" fill="#FEE3B0"/>
  <text x="950" y="577" font-size="14" font-weight="700" fill="#5C380E" text-anchor="middle" letter-spacing="0.04">STAFFED COUNTER</text>

  <text x="800" y="945" text-anchor="middle" font-size="18" fill="#411915" opacity="0.7">One line waits. The other doesn&#8217;t.</text>
</svg>
